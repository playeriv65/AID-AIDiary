# Checks every push to main: analysis and the offline tests, without
# packaging (that is the nightly's). On Linux, the cheapest runner; a burst
# of pushes runs only for the latest, and documentation alone runs nothing.
# See docs/TESTING.md ("Continuous integration").
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Files keep their last commit's time, so cargo finds the cached
      # Rust builds current (a checkout stamps every file with now).
      - uses: chetan/git-restore-mtime-action@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      # The root analyzer also sees the CLI package, as in dev.ps1 analyze.
      - working-directory: cli
        run: dart pub get
      - run: flutter analyze
      # The agent's shell (rust/): its tests load the library cargo builds.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-workspace-crates: true
      - run: cargo build --release --manifest-path rust/Cargo.toml
      - run: flutter test -j 4 --exclude-tags live
      - name: Command line
        working-directory: cli
        run: |
          dart analyze
          dart test

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - working-directory: server
        run: |
          go vet ./...
          go test ./...
