# Daily installable packages for Windows, Android and Linux, plus the checks
# on Windows; every push is checked by ci.yml. A day without commits is
# skipped. See docs/TESTING.md ("Continuous integration").
name: Nightly

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.recent.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: recent
        # Scheduled runs only build what changed in the last day.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] ||
             [ -n "$(git log --since='25 hours ago' -1 --format=%H)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The root analyzer also sees the CLI package, as in dev.ps1 analyze.
      - working-directory: cli
        run: dart pub get
      - run: flutter analyze
      # The agent's shell (rust/): its tests load the library cargo builds.
      - run: cargo build --release --manifest-path rust/Cargo.toml
      - run: flutter test -j 4 --exclude-tags live
      - name: Command line
        working-directory: cli
        run: |
          dart pub get
          dart analyze
          dart test
          New-Item -ItemType Directory -Force ..\build\cli | Out-Null
          dart compile exe bin/aid.dart -o ..\build\cli\aid.exe
      # Without the repository secret the build offers no Google Drive.
      - run: flutter build windows --release --dart-define=AID_GOOGLE_DESKTOP_SECRET=$env:AID_GOOGLE_DESKTOP_SECRET
        env:
          AID_GOOGLE_DESKTOP_SECRET: ${{ secrets.AID_GOOGLE_DESKTOP_SECRET }}
      - name: Package
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath aid-diary-windows.zip
          Copy-Item build\cli\aid.exe aid-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            aid-diary-windows.zip
            aid-windows.exe
          retention-days: 7

  android:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The agent shell's release Rust build (fat LTO) is long on 4 cores.
    timeout-minutes: 120
    env:
      # Show cargo's progress, which Gradle otherwise hides.
      CARGOKIT_VERBOSE: "1"
    steps:
      # Two release builds and their Gradle caches outgrow the runner's free
      # disk; it carries toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/lib/node_modules \
            "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # cargokit compiles the agent's shell (rust/) for the APK's ABI.
      - run: rustup target add aarch64-linux-android
      # No signing key here: both are signed with the debug key, which
      # proves they package but cannot update an installed release.
      - run: flutter build apk --release --flavor independent --target-platform android-arm64
      - run: flutter build apk --release --flavor dev --target-platform android-arm64
      - name: Package
        run: |
          cp build/app/outputs/flutter-apk/app-independent-release.apk aid-diary.apk
          cp build/app/outputs/flutter-apk/app-dev-release.apk aid-diary-dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            aid-diary.apk
            aid-diary-dev.apk
          retention-days: 7

  linux:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # GTK runner toolchain, plus libsecret/jsoncpp for flutter_secure_storage.
      - name: Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=AID_GOOGLE_DESKTOP_SECRET="$AID_GOOGLE_DESKTOP_SECRET"
        env:
          AID_GOOGLE_DESKTOP_SECRET: ${{ secrets.AID_GOOGLE_DESKTOP_SECRET }}
      - name: Command line
        working-directory: cli
        run: |
          dart pub get
          mkdir -p ../build/cli
          dart compile exe bin/aid.dart -o ../build/cli/aid
      - name: Package
        run: |
          tar -C build/linux/x64/release/bundle -czf aid-diary-linux.tar.gz .
          cp build/cli/aid aid-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            aid-diary-linux.tar.gz
            aid-linux
          retention-days: 7

  server:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - working-directory: server
        run: |
          go vet ./...
          go test ./...

  release:
    needs: [windows, android, linux, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # One rolling prerelease, replaced each night.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly --prerelease --target "${{ github.sha }}" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "Built from ${{ github.sha }}. Debug-signed: for checking packages, not for updating an installed release." \
            aid-diary.apk aid-diary-dev.apk aid-diary-windows.zip aid-windows.exe \
            aid-diary-linux.tar.gz aid-linux
