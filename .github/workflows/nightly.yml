# Daily installable packages for Windows, Android and Linux, released only
# when ci.yml's checks pass on the same commit (run here, on Linux, beside
# the packaging). A day without commits is skipped. See docs/TESTING.md
# ("Continuous integration").
name: Nightly

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.recent.outputs.run }}
      build: ${{ steps.build.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      # The build number apps compare: UTC YYMMDDHH and the ten minutes, as
      # scripts/dev.ps1 makes it for local builds (AGENTS.md, "Versions").
      - id: build
        run: |
          now=$(date -u +%y%m%d%H%M)
          echo "build=${now:0:9}" >> "$GITHUB_OUTPUT"
      - id: recent
        # Scheduled runs only build what changed in the last day.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] ||
             [ -n "$(git log --since='25 hours ago' -1 --format=%H)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Analysis and the offline tests, as on every push, on Linux: the same
  # suite takes twice as long on Windows' file system.
  checks:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml

  windows:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Show cargo's progress, which the build otherwise hides.
      CARGOKIT_VERBOSE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Files keep their last commit's time, so cargo finds the cached
      # Rust builds current (a checkout stamps every file with now).
      - uses: chetan/git-restore-mtime-action@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      # The Windows bundle builds the agent's shell (rust/) through cargokit;
      # kept between runs, unchanged Rust is not compiled again.
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
          workspaces: rust
          cache-workspace-crates: true
          cache-directories: build/windows/x64/plugins/aid_shell/cargokit_build
      - name: Command line
        working-directory: cli
        run: |
          dart pub get
          New-Item -ItemType Directory -Force ..\build\cli | Out-Null
          dart compile exe bin/aid.dart -o ..\build\cli\aid.exe
      # Without the repository secret the build offers no Google Drive.
      - run: flutter build windows --release --dart-define=AID_GOOGLE_DESKTOP_SECRET=$env:AID_GOOGLE_DESKTOP_SECRET
        env:
          AID_GOOGLE_DESKTOP_SECRET: ${{ secrets.AID_GOOGLE_DESKTOP_SECRET }}
      - name: Package
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath aid-diary-windows.zip
          Copy-Item build\cli\aid.exe aid-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            aid-diary-windows.zip
            aid-windows.exe
          retention-days: 7

  android:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The agent shell's release Rust build (fat LTO) is long on 4 cores.
    timeout-minutes: 120
    env:
      # Show cargo's progress, which Gradle otherwise hides.
      CARGOKIT_VERBOSE: "1"
    steps:
      # Two release builds and their Gradle caches outgrow the runner's free
      # disk; it carries toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/lib/node_modules \
            "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Files keep their last commit's time, so cargo finds the cached
      # Rust builds current (a checkout stamps every file with now).
      - uses: chetan/git-restore-mtime-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Gradle's dependencies and build cache, kept between runs.
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      # cargokit compiles the agent's shell (rust/) for the APK's ABI, into
      # build/aid_shell/build; kept between runs, unchanged Rust is not
      # compiled again.
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          workspaces: rust
          cache-workspace-crates: true
          cache-directories: build/aid_shell/build
      # The release key from the repository's secrets, so the packages
      # update installed apps (docs/UPDATES.md).
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "No signing key secret" >&2; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release --flavor independent --target-platform android-arm64 --build-number ${{ needs.changes.outputs.build }}
      - run: flutter build apk --release --flavor dev --target-platform android-arm64 --build-number ${{ needs.changes.outputs.build }}
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
      - name: Package
        run: |
          cp build/app/outputs/flutter-apk/app-independent-release.apk aid-diary.apk
          cp build/app/outputs/flutter-apk/app-dev-release.apk aid-diary-dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            aid-diary.apk
            aid-diary-dev.apk
          retention-days: 7

  linux:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # GTK runner toolchain, plus libsecret/jsoncpp for flutter_secure_storage.
      - name: Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=AID_GOOGLE_DESKTOP_SECRET="$AID_GOOGLE_DESKTOP_SECRET"
        env:
          AID_GOOGLE_DESKTOP_SECRET: ${{ secrets.AID_GOOGLE_DESKTOP_SECRET }}
      - name: Command line
        working-directory: cli
        run: |
          dart pub get
          mkdir -p ../build/cli
          dart compile exe bin/aid.dart -o ../build/cli/aid
      - name: Package
        run: |
          tar -C build/linux/x64/release/bundle -czf aid-diary-linux.tar.gz .
          cp build/cli/aid aid-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            aid-diary-linux.tar.gz
            aid-linux
          retention-days: 7

  release:
    needs: [changes, checks, windows, android, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # History for the notes: the commits since the last nightly.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      # latest.json, which apps check for updates (docs/UPDATES.md).
      - name: Manifest
        run: |
          previous=$(gh release view nightly --json targetCommitish -q .targetCommitish 2>/dev/null || true)
          python3 scripts/release_manifest.py --dist dist \
            --build "${{ needs.changes.outputs.build }}" \
            --commit "${{ github.sha }}" --previous "$previous" > dist/latest.json
          cat dist/latest.json
      # One rolling prerelease, replaced each night.
      - run: |
          cd dist
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly --prerelease --target "${{ github.sha }}" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "Built from ${{ github.sha }}, build ${{ needs.changes.outputs.build }}. Android packages are signed with the release key and update installed apps." \
            latest.json aid-diary.apk aid-diary-dev.apk aid-diary-windows.zip \
            aid-windows.exe aid-diary-linux.tar.gz aid-linux
