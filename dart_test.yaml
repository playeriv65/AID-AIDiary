# Test layers. Untagged files are unit tests: pure logic, run while iterating.
# Tag a file with @Tags(['widget']) or @Tags(['integration']) above `library;`.
tags:
  # One page or component on the test harness.
  widget:
  # The whole app, real SQLite, migrations, isolates, encrypted archives.
  integration:
    timeout: 2x
  # Against a real sync server named in the environment (AID_SYNC_URL);
  # skipped without one. Slow: real network and key derivation.
  live:
    timeout: 4x
