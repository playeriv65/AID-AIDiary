services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${EXPOSED_PORT:-8001}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - MEM0_API_URL=http://mem0:8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - UPLOAD_DIR=/app/static/uploads
      - API_KEY=${API_KEY:-your-test-api-key}
      - BASE_URL=${BASE_URL:-https://test-url.example.com}
      - MODEL_NAME=${MODEL_NAME:-test-model}
      - SECRET_KEY=${SECRET_KEY:-test-secret-key}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-test-google-api-key}
    volumes:
      - ./tests:/app/tests:ro
    networks:
      - test_net
    depends_on:
      mem0:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mem0:
    image: ghcr.io/playeriv65/mem0-server:Google
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=mem0graph
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-test-google-api-key}
    networks:
      - test_net
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: ankane/pgvector:v0.5.1
    networks:
      - test_net
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "postgres", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5.26.4
    networks:
      - test_net
    environment:
      - NEO4J_AUTH=neo4j/mem0graph
    volumes:
      - type: tmpfs
        target: /data
      - type: tmpfs
        target: /logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  test_net:
    driver: bridge