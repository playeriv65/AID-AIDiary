org.gradle.jvmargs=-Xmx2g
# Builds are occasional here: no Gradle daemon idles for hours, and Kotlin
# compiles inside it rather than in a second JVM of its own.
org.gradle.daemon.idletimeout=600000kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=false
android.builtInKotlin=false
android.newDsl=false
workmanager.enableDataSyncForegroundService=true
