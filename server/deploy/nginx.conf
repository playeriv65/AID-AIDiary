# nginx site for the sync server; certbot --nginx adds the TLS lines and the
# redirect from port 80. Uploads up to the server's limit, streamed through.
server {
    listen 80;
    server_name aid.playeriv65.com;

    client_max_body_size 260m;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # The authenticated signaling/relay endpoint upgrades to WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # App updates, mirrored from the nightly release by update-mirror/
    # (docs/UPDATES.md). The manifest is never cached.
    location /updates/ {
        alias /srv/aid-updates/www/;
        types {
            application/json json;
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        location = /updates/latest.json {
            alias /srv/aid-updates/www/latest.json;
            add_header Cache-Control "no-cache" always;
        }
    }
}
