# The sync server behind the host's nginx, which terminates TLS.
services:
  aid-sync:
    build: .
    image: aid-sync:latest
    container_name: aid-sync
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      AID_SYNC_TRUST_PROXY: "true"
      AID_SYNC_MEDIA_MAX_OBJECT_BYTES: "${AID_SYNC_MEDIA_MAX_OBJECT_BYTES:-2097152}"
      AID_SYNC_MEDIA_MAX_MANIFEST_BYTES: "${AID_SYNC_MEDIA_MAX_MANIFEST_BYTES:-262144}"
      AID_SYNC_MEDIA_CACHE_BYTES: "${AID_SYNC_MEDIA_CACHE_BYTES:-134217728}"
      AID_SYNC_MEDIA_DAILY_TRANSFER_BYTES: "${AID_SYNC_MEDIA_DAILY_TRANSFER_BYTES:-268435456}"
      AID_SYNC_MEDIA_CACHE_TTL: "${AID_SYNC_MEDIA_CACHE_TTL:-168h}"
    volumes:
      # Owned by the image's nonroot user (uid 65532).
      - ./data:/data
