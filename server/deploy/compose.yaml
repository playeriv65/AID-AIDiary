# The sync server behind the host's nginx, which terminates TLS.
services:
  aid-sync:
    build: .
    image: aid-sync:latest
    container_name: aid-sync
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      AID_SYNC_TRUST_PROXY: "true"
    volumes:
      # Owned by the image's nonroot user (uid 65532).
      - ./data:/data
